<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 智能客服 · 在线咨询</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .status-line { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
    .csat-card {
      align-self: center; background: #fff; border: 1px solid var(--line);
      border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow);
      max-width: 460px; width: 100%; text-align: center;
    }
    .csat-card h4 { margin: 0 0 4px; font-size: 14px; }
    .csat-card p { margin: 0 0 10px; font-size: 12.5px; color: var(--ink-3); }
    .csat-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .csat-reasons { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
    .csat-done { font-size: 12.5px; color: var(--ok); }
    .src-line { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; line-height: 1.7; }
    .src-line b { font-weight: 600; color: var(--ink-2); }
    .sys-msg { align-self: center; font-size: 12px; color: var(--ink-3); background: #f1f3f9; padding: 4px 12px; border-radius: 999px; }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" id="bot-avatar">AI</div>
      <div>
        <h1 id="bot-name">智能客服助手</h1>
        <p class="status-line">
          <span id="service-badge" class="badge gray">加载中…</span>
          <span id="session-badge" class="badge gray">机器人接待中</span>
        </p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn ghost" id="btn-handoff">转人工</button>
      <button class="btn ghost" id="btn-close">结束会话</button>
      <button class="btn ghost" id="btn-clear">新建会话</button>
      <a class="btn" href="/admin">后台</a>
    </div>
  </header>

  <main class="chat-main">
    <div class="messages" id="messages"></div>
    <div class="opt-list" id="opt-list"></div>
    <div class="suggestions" id="suggestions"></div>
    <form class="composer" id="chat-form">
      <textarea id="input" rows="1" placeholder="输入您的问题，例如：怎么退货"></textarea>
      <button type="submit" class="btn primary" id="btn-send">发送</button>
    </form>
    <p class="hint">
      回车发送 · Shift + Enter 换行 · 会话 ID：<code id="session-id">-</code>
      · <a href="/agent">客服工作台</a> · <a href="/dashboard">数据看板</a>
    </p>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="/static/chat.js"></script>
</body>
</html>
