<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · AI 智能客服 MVP</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .login-card {
      background: #fff; border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 18px 50px rgba(28,35,51,.12); padding: 28px; width: min(400px, 100%);
    }
    .login-card h1 { margin: 0 0 4px; font-size: 20px; }
    .login-card .sub { margin: 0 0 20px; font-size: 12.5px; color: var(--ink-3); }
    .demo-box { margin-top: 16px; padding: 10px 12px; background: #f8faff; border: 1px solid #e3e9f8; border-radius: 10px; font-size: 12px; }
    .demo-box b { display: block; margin-bottom: 6px; color: var(--ink-2); }
    .demo-box .row-demo { display: flex; justify-content: space-between; padding: 2px 0; cursor: pointer; }
    .demo-box .row-demo:hover { color: var(--brand); }
    .notice { background: #fff4e5; color: #b54708; padding: 8px 11px; border-radius: 9px; font-size: 12.5px; margin-bottom: 16px; }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>AI 智能客服 MVP</h1>
    <p class="sub">请登录后使用客服工作台与运营后台</p>
    <div id="notice" class="notice" style="display:none;"></div>
    <form id="login-form">
      <div class="field">
        <label>用户名</label>
        <input type="text" id="username" autocomplete="username" placeholder="admin" />
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="admin123" />
      </div>
      <button class="btn primary" type="submit" id="btn-login" style="width:100%;height:40px;">登录</button>
    </form>
    <div class="demo-box" id="demo-box" style="display:none;">
      <b>演示账号（点击自动填入）</b>
      <div id="demo-list"></div>
    </div>
    <p class="help" style="margin-top:14px;">
      想跳过登录？关闭权限认证即可：<code>python run.py</code>（默认 AUTH_ENABLED=0）。
    </p>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="/static/login.js"></script>
</body>
</html>
